<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OryxBot Map Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <div id="sidebar">
            <h1>OryxBot Map Viewer</h1>

            <div class="controls">
                <input type="text" id="searchInput" placeholder="Search clusters...">
                <button id="searchBtn">Find</button>
            </div>

            <div class="filters">
                <h3>Filters</h3>
                <label><input type="checkbox" id="filterWorld" checked> World Zones</label>
                <label><input type="checkbox" id="filterCity" checked> Cities</label>
                <label><input type="checkbox" id="filterDungeon" checked> Dungeons</label>
                <label><input type="checkbox" id="filterBots" checked> OryxBots</label>
            </div>

            <div id="infoPanel" class="hidden">
                <h3>Cluster Info</h3>
                <div id="clusterDetails"></div>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
            <div id="loading">Loading Map Data...</div>
        </div>
    </div>
    <script src="app.js?v=11"></script>
</body>
</html>
